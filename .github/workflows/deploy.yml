# ---------------------------------------------------------------------------
# GitHub Pages deployment for SmartBuyIndia
# ---------------------------------------------------------------------------
# One-time repository setup:
#   1. Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions"
#   2. Push this file. Every push to `main` then rebuilds and deploys.
#
# If your repository is NOT named `smartbuyindia`, update SITE_BASE in
# site.config.js to '/<your-repo-name>/' before deploying.
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
