name: Validate SmartBuyIndia UI

on:
  push:
    branches:
      - feature/editorial-maximalist-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
      - name: Smoke-test all routes
        run: node scripts/smoke.build.mjs
