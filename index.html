<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d33" />
    <meta name="color-scheme" content="light" />

    <title>SmartBuyIndia — Smart choices. Better buys.</title>
    <meta
      name="description"
      content="SmartBuyIndia helps Indian shoppers research products with original buying guides, honest comparisons and product shortlists — then sends you to Amazon.in to buy."
    />
    <meta name="robots" content="__SMARTBUY_ROBOTS__" />
    <meta name="author" content="SmartBuyIndia" />
    <!--
      The canonical link is written at runtime by src/utils/seo.js so it always
      matches the current route and the configured SITE_URL. (A relative href
      here would be treated as a build asset by Vite.)
    -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmartBuyIndia" />
    <meta property="og:title" content="SmartBuyIndia — Smart choices. Better buys." />
    <meta
      property="og:description"
      content="Compare products, explore buying guides and discover useful picks before you buy. Independent product research for Indian shoppers."
    />
    <meta property="og:locale" content="en_IN" />
    <!--
      Relative on purpose: works under any base path before SITE_URL is set,
      and src/utils/seo.js upgrades it to an absolute URL at runtime.
    -->
    <meta property="og:image" content="./images/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SmartBuyIndia — Smart choices. Better buys. Original buying guides, honest comparisons and product shortlists for Indian shoppers." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmartBuyIndia — Smart choices. Better buys." />
    <meta
      name="twitter:description"
      content="Compare products, explore buying guides and discover useful picks before you buy."
    />
    <meta name="twitter:image" content="./images/og/og-default.png" />

    <!-- Icons (vector, tiny, no external requests) -->
    <link rel="icon" href="./favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <!--
      Organization JSON-LD is injected at runtime by src/components/Layout.jsx so
      it always matches src/config/site.js. No duplicate markup here.
    -->
    <script>
      // Set before first paint so nothing flashes.
      document.documentElement.classList.add('js');
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration fallback: visible even if JS is blocked or slow. -->
      <noscript>
        <div style="max-width: 640px; margin: 15vh auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.6; color: #16211d">
          <h1 style="font-size: 1.4rem">SmartBuyIndia</h1>
          <p>
            SmartBuyIndia is an independent Indian product-research website with buying guides,
            product comparisons and shortlists that link out to Amazon.in.
          </p>
          <p>This site needs JavaScript enabled to browse. Please enable it and reload.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
